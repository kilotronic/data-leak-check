name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Refuse the organisation's private terms (the DATA_LEAK_DENYLIST secret) in this event's commits:
  # added lines, file paths, commit messages and authors.
  data-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/data-leak-check@f1da8a7ce76bfaabd70ea815d9417fb691e95799 # v1.1.0
        with:
          denylist: ${{ secrets.DATA_LEAK_DENYLIST }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # prek and pre-commit run the end-to-end hook tests (tests/test_prek.py); without them those tests skip.
      - name: Install (dev, prek, pre-commit)
        run: pip install -e ".[dev]" prek pre-commit
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q -rs

  # Secrets in this event's commits: gitleaks (anything shaped like a secret) and trufflehog (keys that still
  # work), from kilotronic/secret-scan.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/secret-scan@2665d6f2f0260d3ae0defbedcce27fc63ad6a168 # v1.2.1

  # Shell scripts (shellcheck), workflows (actionlint), and actions and base images pinned by commit and
  # digest, from kilotronic/lint.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/lint@57c42f430af9a89607e32d1947714e2e594db6f3 # v1.2.0

  git-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/git-identity@b0d54e809d81cabf61d357cbe519a9b9263b17cb # v2.4.0
        with:
          domains: ixid.net, kilotronic.com
          commit-subject: true

  # This repository's own commits, against a small test denylist. Each entry is written so that its own text
  # here does not match it (a character class, or format() joining two halves), so this file passes.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          denylist: |
            # test terms, not real ones
            re:umbrella[ ]corporation
            re:hooli[.]internal, ${{ format('{0}{1}', 'pied-', 'piper-net') }}

  # The Action must refuse what it is there to refuse. The bad commit is made at run time, so it is never in
  # this repository's history.
  dogfood-refuses:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: Ada Example
      GIT_AUTHOR_EMAIL: ada@example.org
      GIT_COMMITTER_NAME: Ada Example
      GIT_COMMITTER_EMAIL: ada@example.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make a commit holding a test term
        run: |
          printf 'notes for umbrella %s\n' corporation > leak.txt
          git add leak.txt
          git commit -q -m 'Add notes'
      - uses: ./
        id: leak
        continue-on-error: true
        with:
          commits: HEAD^!
          denylist: re:umbrella[ ]corporation
      - uses: ./
        id: empty
        continue-on-error: true
        with:
          commits: HEAD^!
          denylist: ""
      - uses: ./
        id: skip
        with:
          commits: HEAD^!
          denylist: ""
          if-empty: skip
      - name: The leak and the empty denylist must have been refused
        env:
          LEAK: ${{ steps.leak.outcome }}
          EMPTY: ${{ steps.empty.outcome }}
        run: |
          echo "leak=$LEAK empty=$EMPTY"
          test "$LEAK" = failure && test "$EMPTY" = failure

  # The format and lint bundle from .pre-commit-config.yaml (formatters, ruff, markdownlint, yamllint, ...),
  # the same hooks a commit runs. The identity, secret and private-term hooks run as their own jobs.
  prek:
    name: Format and lint (prek)
    runs-on: ubuntu-latest
    env:
      SKIP: git-identity,commit-subject,session-trailer,secret-scan,secret-scan-push,data-leak-check,data-leak-check-commit-msg,data-leak-check-pre-push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run prek==0.5.11 run --all-files --show-diff-on-failure

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs:
      [
        test,
        git-identity,
        secret-scan,
        lint,
        dogfood,
        dogfood-refuses,
        data-leak-check,
        prek,
      ]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do test "$r" = success; done
